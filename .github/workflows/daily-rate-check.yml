name: Daily Rate Check

on:
  schedule:
    # 9am UTC daily - adjust to whenever makes sense for your timezone
    - cron: '0 9 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab to test
  
concurrency: 
  group: daily-rate-check
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scraper
        run: python scripts/scrape_rates.py

      - name: Commit updated data if changed
        run: |
          git config user.name "Savvli Rate Bot"
          git config user.email "actions@github.com"
          git add stores-data.js data/scrape_log.json data/latest_results.json
          git diff --staged --quiet || git commit -m "Daily rate update $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
